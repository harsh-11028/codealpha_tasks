version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: disease-prediction-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=disease_prediction_db
    networks:
      - disease-prediction-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disease-prediction-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DB_NAME=disease_prediction_db
      - SECRET_KEY=change-this-secret-key-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://frontend:3000"]
      - ML_MODELS_PATH=/app/ml_models
    volumes:
      - ./ml/models:/app/ml_models:ro
    depends_on:
      - mongodb
    networks:
      - disease-prediction-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disease-prediction-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - disease-prediction-net

volumes:
  mongodb_data:
    driver: local

networks:
  disease-prediction-net:
    driver: bridge
