name: Antigravity OCR CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend PyTorch & API Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (OpenCV & Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 tesseract-ocr tesseract-ocr-eng

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Execute Unit & Integration Test Suites
        run: |
          pytest tests/ --doctest-modules --junitxml=junit/test-results-${{ matrix.python-version }}.xml
        env:
          PYTHONPATH: .
          APP_ENV: testing

  build-frontend:
    name: React TypeScript Verification & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Node Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Type Check & Production Static Asset Build
        working-directory: ./frontend
        run: npm run build

  docker-verify:
    name: Docker Build & Container Verification
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Image Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: false
          tags: antigravity/ocr-backend:test
          cache-from: type=gha

      - name: Verify Frontend Docker Image Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: false
          tags: antigravity/ocr-frontend:test
          cache-from: type=gha
