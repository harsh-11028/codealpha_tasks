# ============================================================
# GitHub Actions CI — Build & Lint only (lightweight)
# Heavy ML dependencies (torch, librosa) are skipped in CI.
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend Build ─────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: speech-recognition/frontend/package-lock.json

      - name: Install dependencies
        working-directory: speech-recognition/frontend
        run: npm ci

      - name: Type check + Build
        working-directory: speech-recognition/frontend
        run: npm run build

  # ── Backend Lint ───────────────────────────────────────────
  backend-lint:
    name: Backend Lint (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint tools only
        run: pip install flake8 black

      - name: Lint with flake8
        working-directory: speech-recognition/backend
        run: flake8 . --count --max-line-length=120 --exclude=venv,__pycache__ --statistics || true

      - name: Check formatting with black
        working-directory: speech-recognition/backend
        run: black --check --line-length 120 . --exclude '/(venv|__pycache__)/' || true
